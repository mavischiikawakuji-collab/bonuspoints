
<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>積分管家</title>
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="icon" type="image/png" href="./icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@600&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-light:#f6e27a;--bg:#070708;--card:#121212;--border:rgba(255,255,255,0.08);}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:radial-gradient(1200px 600px at 80% -10%, rgba(212,175,55,0.18), transparent 60%), radial-gradient(800px 400px at -10% 30%, rgba(212,175,55,0.12), transparent 50%), #070708;color:#fff;font-family:"Outfit","Noto Sans TC",system-ui,sans-serif;overflow-x:hidden}
h1{font-family:"Cinzel","Space Grotesk",serif;letter-spacing:0.04em;background:linear-gradient(100deg,#d4af37 0%,#f6e27a 25%,#d4af37 50%,#f6e27a 75%,#d4af37 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:goldFlow 10s linear infinite;}
@keyframes goldFlow{0%{background-position:0% center}100%{background-position:200% center}}
.container{max-width:560px;margin:0 auto;padding:16px;padding-bottom:120px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02)),#121212;border:1px solid rgba(212,175,55,0.12);border-radius:14px;padding:10px 12px}
.stat-label{font-size:11px;color:rgba(255,255,255,0.4)}
.stat-value{font-size:18px;font-weight:600;margin-top:4px}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;height:44px;border-radius:14px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);padding:0 12px 0 36px;color:#fff;font-size:14px}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.3}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;height:32px;padding:0 16px;border-radius:9999px;border:1px solid rgba(255,255,255,0.08);background:#1a1a1a;color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer}
.cat.active{background:linear-gradient(135deg,#d4af37,#f6e27a);color:#000;border-color:#d4af37}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02)),#121212;border:1px solid rgba(212,175,55,0.18);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(246,226,122,0.06) 50%,transparent 80%);background-size:200% 100%;animation:shimmer 8s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.card-icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:20px}
.badge{font-size:11px;padding:4px 8px;border-radius:9999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.5)}
.points{font-size:28px;font-weight:700;margin-top:8px;position:relative;z-index:1}
.points small{font-size:14px;font-weight:400;opacity:0.6}
.reward{font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;position:relative;z-index:1}
.progress{height:6px;background:rgba(255,255,255,0.08);border-radius:9999px;margin-top:12px;overflow:hidden;position:relative;z-index:1}
.progress-fill{height:100%;background:linear-gradient(90deg,#d4af37,#f6e27a);border-radius:9999px;transition:width 0.3s}
.expiry{font-size:11px;color:rgba(255,255,255,0.35);margin-top:8px;position:relative;z-index:1}
.expiry.warn{color:#ff6b6b}
.fab{position:fixed;right:24px;bottom:24px;z-index:50;width:64px;height:64px;border-radius:9999px;background:linear-gradient(135deg,#d4af37 0%,#f6e27a 50%,#d4af37 100%);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(212,175,55,0.45),0 0 0 1px rgba(212,175,55,0.4);border:none;cursor:pointer;transition:transform 0.15s}
.fab:active{transform:scale(0.96)}
.fab.hidden{display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:#181818;border:1px solid rgba(255,255,255,0.08);border-radius:20px;width:100%;max-width:480px;padding:20px;margin-top:20px}
.modal h2{font-size:18px;font-weight:700;margin:0 0 16px 0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;min-width:0}
.form-group{margin-bottom:12px}
.form-group.full{grid-column:1 / -1;width:100%;max-width:100%;}
.form-group label{display:block;font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:6px}
.form-group input,.form-group select{width:100%;max-width:100%;height:44px;border-radius:12px;background:#252525;border:1px solid rgba(255,255,255,0.08);padding:0 12px;color:#fff;font-size:14px;box-sizing:border-box;-webkit-appearance:none;appearance:none;margin:0}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.icon-btn{height:56px;border-radius:16px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.icon-btn.active{background:rgba(212,175,55,0.2);border-color:rgba(212,175,55,0.5);color:#fff}
.icon-btn span:first-child{font-size:20px;line-height:1}
.icon-btn span:last-child{font-size:10px;opacity:0.7}
.unit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.unit-btn{height:44px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);font-size:13px;font-weight:600;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.unit-btn.active{background:rgba(212,175,55,0.2);border-color:rgba(212,175,55,0.5);color:#fff}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;height:46px;border-radius:9999px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-cancel{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}
.btn-save{background:linear-gradient(135deg,#d4af37,#f6e27a);color:#000}
.empty{border:1px dashed rgba(255,255,255,0.12);background:rgba(255,255,255,0.02);border-radius:20px;padding:40px 20px;text-align:center;margin-top:20px}
input[type="date"]{ -webkit-appearance:none; appearance:none; box-sizing:border-box; max-width:100%; }
.form-group{ min-width:0; }
.form-grid{ min-width:0; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1 style="font-size:22px;margin:0">積分管家</h1><div style="font-size:12px;color:rgba(255,255,255,0.3)">黑金版</div></div>
  <div class="stats">
    <div class="stat"><div class="stat-label">卡片</div><div class="stat-value" id="statCards">0</div></div>
    <div class="stat"><div class="stat-label">總積分</div><div class="stat-value" id="statPoints">0</div></div>
    <div class="stat"><div class="stat-label">總值</div><div class="stat-value" id="statValue">HK$ 0.0</div></div>
  </div>
  <div class="search">
    <div class="search-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="M21 21l-3.5-3.5"/></svg><input id="searchInput" placeholder="搜尋卡片、獎賞..."></div>
  </div>
  <div class="cats" id="catFilter"></div>
  <div id="cardList"></div>
  <div class="empty" id="empty" style="display:none"><div style="font-size:24px;margin-bottom:8px">🪪</div><div style="font-weight:600">未有積分卡</div><div style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:6px">新增你的第一張積分卡</div></div>
</div>
<button class="fab" id="fab" aria-label="新增"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="modal-overlay" id="modal" style="display:none"><div class="modal" onclick="event.stopPropagation()">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 id="modalTitle">新增積分卡</h2><button onclick="closeModal()" style="width:32px;height:32px;border-radius:9999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);cursor:pointer">✕</button></div>
  <div style="margin-bottom:12px"><label style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:6px;display:block">類別圖示</label><div class="icon-grid" id="iconGrid"></div></div>
  <div class="form-grid">
    <div class="form-group"><label>卡片名稱</label><input id="fName" placeholder="例如 Starbucks"></div>
    <div class="form-group"><label>單位（快捷鍵）</label><div class="unit-grid" id="unitGrid"></div></div>
    <div class="form-group"><label>現有積分</label><input id="fPoints" type="number" inputmode="numeric" placeholder="例如 520"></div>
    <div class="form-group"><label>目標積分</label><input id="fGoal" type="number" inputmode="numeric" placeholder="例如 500"></div>
    <div class="form-group full"><label>獎賞</label><input id="fReward" placeholder="例如 $20現金券"></div>
    <div class="form-group full"><label>積分到期日</label><input id="fExpiry" type="date"></div>
    <div class="form-group full" style="background:rgba(212,175,55,0.07);border:1px solid rgba(212,175,55,0.15);border-radius:14px;padding:12px">
      <div style="font-size:12px;color:#d4af37;margin-bottom:8px">💱 換算設定</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label style="font-size:11px;color:rgba(255,255,255,0.4)">積分</label><input id="fConvPoints" type="number" placeholder="200" style="height:40px"></div><div><label style="font-size:11px;color:rgba(255,255,255,0.4)">等於 HK$</label><input id="fConvValue" type="number" step="0.1" placeholder="1.5" style="height:40px"></div></div>
      <div style="font-size:12px;color:#f6e27a;margin-top:8px">總值 HK$ <span id="fTotal">0.0</span></div>
    </div>
  </div>
  <div class="actions"><button class="btn btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-save" onclick="saveCard()">新增</button></div>
</div></div>
<script>
let cards = [];
try{const s=localStorage.getItem('jifen_cards_v1'); if(s) cards=JSON.parse(s);}catch(e){}
let filterCat='全部', searchText='', editingId=null;
let formState={name:'',points:'',unit:'分',goal:'',reward:'',icon:'⭐',category:'其他',convPoints:'200',convValue:'1',expiryDate:''};
const cats=[{e:'🍜',label:'餐飲',cat:'餐飲'},{e:'🛍️',label:'購物',cat:'購物'},{e:'🎬',label:'娛樂',cat:'娛樂'},{e:'✈️',label:'旅遊',cat:'旅遊'},{e:'⭐',label:'其他',cat:'其他'}];
const allCats=['全部','餐飲','購物','娛樂','旅遊','其他'];
const units=['分','里','星'];

function saveLocal(){localStorage.setItem('jifen_cards_v1', JSON.stringify(cards));}
function calcValue(p){const cp=parseFloat(p.convPoints)||200, cv=parseFloat(p.convValue)||0, pts=parseFloat(p.points)||0; if(!cp) return 0; return pts/cp*cv;}
function daysLeft(dateStr){if(!dateStr) return null; const now=new Date(); now.setHours(0,0,0,0); const exp=new Date(dateStr); exp.setHours(0,0,0,0); return Math.ceil((exp-now)/86400000);}

function renderFilters(){
  const c=document.getElementById('catFilter'); c.innerHTML='';
  allCats.forEach(cat=>{const b=document.createElement('button'); b.className='cat'+(filterCat===cat?' active':''); b.textContent=cat; b.onclick=()=>{filterCat=cat; render();}; c.appendChild(b);});
}
function renderCards(){
  const list=document.getElementById('cardList'); list.innerHTML='';
  const filtered=cards.filter(c=>{
    const matchSearch = (c.name+c.reward).toLowerCase().includes(searchText.toLowerCase());
    const matchCat = filterCat==='全部'||c.category===filterCat;
    return matchSearch&&matchCat;
  });
  document.getElementById('empty').style.display=filtered.length?'none':'block';
  document.getElementById('statCards').textContent=cards.length;
  document.getElementById('statPoints').textContent=cards.reduce((a,b)=>a+(parseFloat(b.points)||0),0);
  document.getElementById('statValue').textContent='HK$ '+cards.reduce((a,b)=>a+calcValue(b),0).toFixed(1);
  filtered.forEach(p=>{
    const percent = p.goal>0?Math.min(100,(p.points/p.goal)*100):0;
    const d=daysLeft(p.expiryDate);
    let expiryText=''; let expiryClass='expiry';
    if(p.expiryDate){const dt=new Date(p.expiryDate).toLocaleDateString(); if(d<0){expiryText=dt+' 已過期';}else if(d===0){expiryText='今日到期'; expiryClass+=' warn';}else{expiryText=d+'日後到期 ('+dt+')'; if(d<=7) expiryClass+=' warn';} } else if(p.expiryDays){expiryText=p.expiryDays+'日後到期';}
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<div class="card-top"><div style="display:flex;gap:10px;align-items:center"><div class="card-icon">${p.icon}</div><div><div style="font-size:14px;font-weight:600">${p.name}</div><div style="font-size:11px;color:rgba(255,255,255,0.4)">${p.category} · ${p.reward||'未設定獎賞'}</div></div></div><div style="display:flex;gap:6px"><span class="badge">${p.points} ${p.unit}</span><button onclick="editCard('${p.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer">✎</button><button onclick="deleteCard('${p.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer">🗑</button></div></div><div class="points">${p.points} <small>${p.unit}</small></div>${p.goal>0?`<div style="display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.4);margin-top:8px"><span>目標 ${p.goal}</span><span>${percent.toFixed(0)}%</span></div><div class="progress"><div class="progress-fill" style="width:${percent}%"></div></div>`:''}<div style="display:flex;justify-content:space-between;margin-top:8px"><span style="font-size:11px;color:rgba(255,255,255,0.35)">🔁 ${p.convPoints}${p.unit} = $${parseFloat(p.convValue).toFixed(1)}</span><span class="${expiryClass}">${expiryText}</span></div>`;
    list.appendChild(div);
  });
}
function render(){renderFilters(); renderCards();}
function openModal(edit=null){
  document.getElementById('modal').style.display='flex';
  document.getElementById('fab').classList.add('hidden');
  document.body.style.overflow='hidden';
  if(edit){editingId=edit.id; document.getElementById('modalTitle').textContent='編輯積分卡'; document.querySelector('.btn-save').textContent='儲存'; formState={...edit};} else {editingId=null; document.getElementById('modalTitle').textContent='新增積分卡'; document.querySelector('.btn-save').textContent='新增'; formState={name:'',points:'',unit:'分',goal:'',reward:'',icon:'⭐',category:'其他',convPoints:'200',convValue:'1',expiryDate:''};}
  renderForm();
}
function closeModal(){document.getElementById('modal').style.display='none'; document.getElementById('fab').classList.remove('hidden'); document.body.style.overflow='';}
function renderForm(){
  // icon grid
  const ig=document.getElementById('iconGrid'); ig.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('button'); b.type='button'; b.className='icon-btn'+(formState.icon===c.e?' active':'');
    b.innerHTML=`<span>${c.e}</span><span>${c.label}</span>`; b.onclick=()=>{formState.icon=c.e; formState.category=c.cat; renderForm();}; ig.appendChild(b);
  });
  // unit grid - same design as icon
  const ug=document.getElementById('unitGrid'); ug.innerHTML='';
  units.forEach(u=>{
    const b=document.createElement('button'); b.type='button'; b.className='unit-btn'+(formState.unit===u?' active':'');
    b.innerHTML=`<span>${u}</span>`; b.onclick=()=>{formState.unit=u; renderForm(); updateTotal();}; ug.appendChild(b);
  });
  document.getElementById('fName').value=formState.name;
  document.getElementById('fPoints').value=formState.points;
  document.getElementById('fGoal').value=formState.goal;
  document.getElementById('fReward').value=formState.reward;
  document.getElementById('fExpiry').value=formState.expiryDate||'';
  document.getElementById('fConvPoints').value=formState.convPoints;
  document.getElementById('fConvValue').value=formState.convValue;
  updateTotal();
}
function updateTotal(){const p=parseFloat(document.getElementById('fPoints').value)||0; const cp=parseFloat(document.getElementById('fConvPoints').value)||200; const cv=parseFloat(document.getElementById('fConvValue').value)||0; const total=cp? (p/cp*cv).toFixed(1):'0.0'; document.getElementById('fTotal').textContent=total;}
['fPoints','fConvPoints','fConvValue'].forEach(id=>{document.getElementById(id).addEventListener('input', updateTotal);});
document.getElementById('fName').addEventListener('input', e=>formState.name=e.target.value);
document.getElementById('fPoints').addEventListener('input', e=>{formState.points=e.target.value; updateTotal();});
document.getElementById('fGoal').addEventListener('input', e=>formState.goal=e.target.value);
document.getElementById('fReward').addEventListener('input', e=>formState.reward=e.target.value);
document.getElementById('fExpiry').addEventListener('change', e=>formState.expiryDate=e.target.value);
document.getElementById('fConvPoints').addEventListener('input', e=>formState.convPoints=e.target.value);
document.getElementById('fConvValue').addEventListener('input', e=>formState.convValue=e.target.value);

function saveCard(){
  const name=document.getElementById('fName').value.trim(); if(!name){alert('請輸入卡片名稱'); return;}
  const data={id:editingId||Date.now().toString(), name, points:parseFloat(document.getElementById('fPoints').value)||0, unit:formState.unit||'分', goal:parseFloat(document.getElementById('fGoal').value)||0, reward:document.getElementById('fReward').value.trim(), icon:formState.icon, category:formState.category, convPoints:parseFloat(document.getElementById('fConvPoints').value)||200, convValue:parseFloat(document.getElementById('fConvValue').value)||1, expiryDate:document.getElementById('fExpiry').value||''};
  if(editingId){cards=cards.map(c=>c.id===editingId?{...c,...data}:c);} else {cards=[data,...cards];}
  saveLocal(); closeModal(); render();
}
function editCard(id){const c=cards.find(x=>x.id===id); if(c) openModal(c);}
function deleteCard(id){if(confirm('確定刪除？')){cards=cards.filter(c=>c.id!==id); saveLocal(); render();}}
document.getElementById('fab').onclick=()=>openModal();
document.getElementById('searchInput').oninput=e=>{searchText=e.target.value; renderCards();};
document.getElementById('modal').onclick=closeModal;
render();
</script>
</body>
</html>
